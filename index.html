<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ireland Trip Dashboard v12</title>
<script src="https://cdn.tailwindcss.com"></script>

<style>
.modal-enter { animation: fadeIn .25s ease-out forwards; }
@keyframes fadeIn {
  from { opacity:0; transform:scale(.97); }
  to { opacity:1; transform:scale(1); }
}
</style>
</head>

<body class="bg-slate-100 font-sans">

<div class="max-w-6xl mx-auto p-6">
<h1 class="text-3xl font-bold text-center mb-2">Ireland Master Dashboard</h1>
<h2 class="text-center text-slate-600 mb-6">May 27 – June 5, 2026</h2>
<div id="calendar" class="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-5"></div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-50 hidden items-center justify-center p-4">
<div id="modalContent" class="bg-white max-w-2xl w-full rounded-xl shadow-xl p-6 relative modal-enter overflow-y-auto max-h-[90vh]">

<button onclick="closeModal()" class="absolute top-3 right-3 text-xl">&times;</button>

<div id="headerSection" class="mb-4"></div>
<div id="dayContainer"></div>

<div class="flex justify-between mt-6">
<button onclick="navigateDay(-1)" class="bg-slate-200 px-4 py-2 rounded hover:bg-slate-300">← Previous</button>
<button onclick="navigateDay(1)" class="bg-slate-200 px-4 py-2 rounded hover:bg-slate-300">Next →</button>
</div>

</div>
</div>

<script>

const tripDays = [

{
date:"2026-06-02",
label:"June 2",
title:"Wicklow Mountains Scenic Loop",
dress:"Outdoor",
lat:53.0103, lon:-6.3279,
agenda:[
"09:00 – Depart Carton House via N81 → Sally Gap",
"10:15 – Guinness Lake (Lough Tay) overlook – 15 min stop (weather dependent)",
"10:45–12:15 – Glendalough Monastic City exploration",
"12:15–12:45 – Upper Lake micro‑hike (flat lakeside walk, 30 min)",
"13:00–14:00 – Lunch at Wicklow Heather ✅",
"14:30–15:45 – Powerscourt Waterfall",
"16:00–17:00 – Scenic descent via Enniskerry",
"~17:30 – Return to Carton House",
"18:30 – Depart for Dublin",
"19:15 – Dinner at Fish Shop ✅"
]
},

{
date:"2026-06-03",
label:"June 3",
title:"Spa + Dublin Shopping",
dress:"Smart Casual",
lat:53.3498, lon:-6.2603,
agenda:[
"09:00 – Couples Massage (Carton House Spa)",
"10:00–10:45 – Shower + change",
"11:00 – Depart for Dublin",
"11:45 – Arrive & park (Grafton/Drury area)",
"Cleo (sweaters)",
"12:30 – Lunch at Seafood Café by Niall Sabongi ✅",
"Kilkenny Design / Aran Sweater Market",
"Louis Copeland (tweed jacket)",
"Indigo & Cloth (if time)",
"16:30 – Depart Dublin (locked departure time)",
"~17:15–17:30 – Arrive Carton House",
"Freshen up",
"18:15 – Ride pickup in lobby",
"18:30 – Dinner at Avenue Café ✅"
]
},

{
date:"2026-06-04",
label:"June 4",
title:"Howth Puffins + King Sitric",
dress:"Smart Casual",
lat:53.3870, lon:-6.0653,
agenda:[
"08:30 – Depart Carton House",
"09:45 – Harbour walk + coffee",
"11:00–12:00 – Ireland’s Eye boat tour",
"12:30 – Lunch at King Sitric ✅",
"15:30 – Depart Howth (latest)",
"~16:30–16:45 – Arrive Carton House",
"Clean up + change",
"17:30 – Group Photo",
"18:00 – Dinner"
]
}

];

let currentIndex = 0;

function weatherIcon(code){
if(code === 0) return "☀️";
if(code <= 2) return "🌤";
if(code === 3) return "☁️";
if(code <= 65) return "🌧";
if(code <= 82) return "🌦";
if(code <= 99) return "⛈";
return "🌥";
}

function loadCalendar(){
const cal=document.getElementById("calendar");
tripDays.forEach((day,index)=>{
const card=document.createElement("div");
card.className="bg-white p-4 rounded-lg shadow hover:shadow-lg transition cursor-pointer";
card.onclick=()=>showDay(index);

card.innerHTML=`
<div class="font-bold text-lg">${day.label}</div>
<div class="text-sm text-slate-600 mb-2">${day.title}</div>
<div id="weather-${index}" class="text-xs text-slate-500">Loading forecast...</div>
`;

cal.appendChild(card);
fetchDailyWeather(index);
});
}

function fetchDailyWeather(index){
const day=tripDays[index];

fetch(`https://api.open-meteo.com/v1/forecast?latitude=${day.lat}&longitude=${day.lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weathercode,windspeed_10m_max&timezone=Europe/Dublin`)
.then(r=>r.json())
.then(data=>{
const dates=data.daily.time;
const dateIndex=dates.indexOf(day.date);
if(dateIndex===-1) return;

const hi=(data.daily.temperature_2m_max[dateIndex]*9/5+32).toFixed(0);
const lo=(data.daily.temperature_2m_min[dateIndex]*9/5+32).toFixed(0);
const rain=data.daily.precipitation_probability_max[dateIndex];
const wind=data.daily.windspeed_10m_max[dateIndex];
const code=data.daily.weathercode[dateIndex];

tripDays[index].forecast={hi,lo,rain,wind,code};

document.getElementById(`weather-${index}`).innerHTML=
`${weatherIcon(code)} ${hi}°/${lo}° • 🌧 ${rain}% • 💨 ${wind} mph`;
});
}

function showDay(index){
currentIndex=index;
updateHeader(tripDays[index].label);
renderDay(tripDays[index]);
document.getElementById("modal").classList.remove("hidden");
document.getElementById("modal").classList.add("flex");
}

function renderDay(day){
let f=day.forecast||{};
let agendaHTML=day.agenda.map(item=>`<li>${item}</li>`).join("");

document.getElementById("dayContainer").innerHTML=`
<h2 class="text-2xl font-bold mb-2">${day.title}</h2>
<div class="text-sm mb-3">
${weatherIcon(f.code||0)} ${f.hi||"--"}°/${f.lo||"--"}° • 🌧 ${f.rain||"--"}% • 💨 ${f.wind||"--"} mph
</div>
<ul class="list-disc ml-6 space-y-1">${agendaHTML}</ul>
`;
}

function navigateDay(dir){
let newIndex=currentIndex+dir;
if(newIndex>=0 && newIndex<tripDays.length){
showDay(newIndex);
}
}

function updateHeader(label){
const now=new Date();
const irelandTime=now.toLocaleTimeString("en-US",{timeZone:"Europe/Dublin"});
document.getElementById("headerSection").innerHTML=
`<div class="text-lg font-semibold">${label}, 2026</div>
<div class="text-sm text-slate-500">Local Time: ${irelandTime}</div>`;
}

function closeModal(){
document.getElementById("modal").classList.add("hidden");
}

// Swipe Support
let touchStartX = 0;
let touchEndX = 0;

const modalContent = document.getElementById("modalContent");

modalContent.addEventListener("touchstart", e => {
touchStartX = e.changedTouches[0].screenX;
});

modalContent.addEventListener("touchend", e => {
touchEndX = e.changedTouches[0].screenX;
handleSwipe();
});

function handleSwipe(){
if(touchEndX < touchStartX - 50){
navigateDay(1); // Swipe left → next
}
if(touchEndX > touchStartX + 50){
navigateDay(-1); // Swipe right → previous
}
}

loadCalendar();

</script>
</body>
</html>
